# The roadmap timeline starts here and spans `months` months.
roadmap:
  starts_on: 2026-09-01
  months: 6

# Ticket ids are assigned from `prefix` in epic/task order, starting at 101 (ATL-101, ATL-102, ...).
# milestone status: done | progress | planned | risk. task status: done | progress | todo | blocked.
# release channel: stable | beta | hotfix.
projects:
  - id: atlas
    prefix: ATL
    name: Atlas
    description: 'The customer-facing platform: workspaces, documents, and the assistant surface.'
    current_epic: Shared workspaces
    next_deliverable: Workspaces beta to 10 design partners
    next_date: 2026-10-02
    milestones:
      - { name: Document editor v2, starts_on: 2026-09-01, ends_on: 2026-09-28, status: done, progress: 100 }
      - { name: Shared workspaces, starts_on: 2026-09-16, ends_on: 2026-10-28, status: progress, progress: 62 }
      - { name: Permissions & audit log, starts_on: 2026-10-19, ends_on: 2026-11-25, status: planned, progress: 0 }
      - { name: Mobile companion, starts_on: 2026-11-16, ends_on: 2027-01-19, status: planned, progress: 0 }
      - { name: Enterprise SSO, starts_on: 2026-12-07, ends_on: 2027-01-07, status: risk, progress: 0 }
      - { name: Public launch, starts_on: 2027-01-25, ends_on: 2027-02-13, status: planned, progress: 0 }
    epics:
      - name: Shared workspaces
        tasks:
          - { title: Invite flow with email + link, owner: Mira, status: done }
          - { title: Workspace switcher in sidebar, owner: Jonas, status: done }
          - { title: Real-time presence indicators, owner: Mira, status: progress }
          - { title: 'Role picker: owner / editor / viewer', owner: Dev, status: progress }
          - { title: Activity feed per workspace, owner: Jonas, status: todo }
          - { title: Migration for existing single-user docs, owner: Dev, status: blocked }
      - name: Permissions & audit log
        tasks:
          - { title: Define audit event schema, owner: Dev, status: todo }
          - { title: Export audit log as CSV, status: todo }
      - name: Housekeeping
        tasks:
          - { title: Upgrade Postgres to 17, owner: Dev, status: done }
          - { title: Remove legacy editor flag, owner: Jonas, status: todo }
    releases:
      - version: 2.14.1
        date: 2026-09-12
        channel: hotfix
        title: Bulk endpoint validation fix
        summary: Rolls back the validation regression shipped in 2.14.0 that returned errors for some bulk requests.
        changes:
          fixed:
            - Bulk document import rejected payloads with optional fields missing
            - Retry button in import dialog did nothing after a failure
      - version: 2.14.0
        date: 2026-09-10
        channel: stable
        title: Document editor v2 for everyone
        summary: The new editor leaves beta. Faster on large documents, with inline comments and a cleaner formatting toolbar.
        changes:
          added:
            - Inline comments with @mentions
            - Slash commands for headings, tables and callouts
            - Keyboard shortcut reference (press ?)
          changed:
            - Autosave interval reduced from 10s to 2s
            - Formatting toolbar collapses on narrow screens
          fixed:
            - Pasting from Google Docs dropped nested lists
      - version: 2.13.0
        date: 2026-08-27
        channel: stable
        title: Workspace invitations
        summary: 'First piece of shared workspaces: invite teammates by email or link.'
        changes:
          added:
            - Invite by email or shareable link
            - Pending invitations list under Settings

  - id: relay
    prefix: RLY
    name: Relay
    description: Public API, webhooks and integrations that let customers connect Halden to their own tools.
    current_epic: Webhook reliability
    next_deliverable: Guaranteed delivery with replay
    next_date: 2026-09-30
    milestones:
      - { name: API v2 GA, starts_on: 2026-09-01, ends_on: 2026-09-19, status: done, progress: 100 }
      - { name: Webhook reliability, starts_on: 2026-09-07, ends_on: 2026-10-10, status: progress, progress: 70 }
      - { name: Zapier & Make connectors, starts_on: 2026-10-07, ends_on: 2026-11-19, status: planned, progress: 0 }
      - { name: Rate-limit tiers, starts_on: 2026-11-13, ends_on: 2026-12-10, status: planned, progress: 0 }
      - { name: Partner SDKs (JS, Python), starts_on: 2026-12-01, ends_on: 2027-02-07, status: planned, progress: 0 }
    epics:
      - name: Webhook reliability
        tasks:
          - { title: Persist events before dispatch, owner: Dev, status: done }
          - { title: Exponential backoff with jitter, owner: Dev, status: done }
          - { title: Replay endpoint for failed deliveries, owner: Sam, status: progress }
          - { title: Delivery log in customer dashboard, owner: Mira, status: progress }
          - { title: Signing key rotation, owner: Sam, status: todo }
      - name: Connectors
        tasks:
          - { title: Zapier app submission, owner: Sam, status: todo }
          - { title: Make.com module scaffolding, status: todo }
    releases:
      - version: 1.8.0
        date: 2026-09-08
        channel: stable
        title: Webhook retries
        summary: Failed deliveries now retry up to 8 times over 24 hours.
        changes:
          added:
            - Automatic retries with backoff
            - X-Halden-Attempt header on each delivery
          changed:
            - Webhook timeout raised from 5s to 10s
      - version: 1.7.2
        date: 2026-08-21
        channel: stable
        title: Pagination fixes
        summary: Cursor pagination returned duplicate rows in rare cases.
        changes:
          fixed:
            - Duplicate items across page boundaries when rows shared a timestamp

  - id: scout
    prefix: SCT
    name: Scout
    description: 'The AI assistant: retrieval, tool use, and the model gateway behind it.'
    current_epic: Provider failover
    next_deliverable: Automatic failover between model providers
    next_date: 2026-09-22
    milestones:
      - { name: Retrieval over workspace docs, starts_on: 2026-09-01, ends_on: 2026-09-25, status: done, progress: 100 }
      - { name: Provider failover, starts_on: 2026-09-10, ends_on: 2026-09-28, status: risk, progress: 55 }
      - { name: 'Tool use: calendar & email', starts_on: 2026-09-25, ends_on: 2026-11-13, status: progress, progress: 20 }
      - { name: Evaluation harness, starts_on: 2026-10-16, ends_on: 2026-12-01, status: planned, progress: 0 }
      - { name: Voice input, starts_on: 2026-12-13, ends_on: 2027-02-01, status: planned, progress: 0 }
    epics:
      - name: Provider failover
        tasks:
          - { title: Health scoring per provider, owner: Sam, status: done }
          - { title: Route on latency + error rate, owner: Sam, status: progress }
          - { title: Alert when failover triggers, owner: Dev, status: todo }
          - { title: Cost report per provider, status: todo }
      - name: Tool use
        tasks:
          - { title: Calendar read access via OAuth, owner: Jonas, status: progress }
          - { title: Draft email tool, status: todo }
          - { title: Confirmation step before any write, owner: Mira, status: todo }
    releases:
      - version: 0.9.0
        date: 2026-09-03
        channel: beta
        title: Cited answers
        summary: Every answer grounded in workspace documents now shows where it came from.
        changes:
          added:
            - Inline citations linking to the source paragraph
            - Answer confidence indicator
          fixed:
            - Assistant ignored documents added in the last 5 minutes

# Meeting notes, newest first. `project` is a project id, or omitted for company-wide meetings.
meetings:
  - id: 1
    date: 2026-09-14
    duration: 52 min
    attendees: Board + leads
    title: Q3 review with the board
    summary: Revenue landed 6% above the Q3 plan; churn steady at 1.9%. The board asked for a clearer date on the Atlas public launch and agreed to fund the SOC 2 audit now rather than in Q1. Model provider costs were flagged as the main risk to gross margin.
    decisions:
      - Fund SOC 2 Type I this quarter
      - Atlas public launch date to be committed by 1 Oct
      - Monthly cost report per model provider
    actions:
      - { text: Draft launch date proposal, owner: Mira }
      - { text: Sign SOC 2 engagement, owner: Ana }
      - { text: Provider cost dashboard in Headquarter, owner: Dev }
    transcript:
      - { who: Ana, at: '00:00', text: 'Welcome everyone. We will go through the numbers first, then Atlas, then risks.' }
      - { who: Ana, at: '03:12', text: Q3 closed at 6% above plan. Most of the upside came from two enterprise expansions. }
      - { who: Commissioner, at: '11:40', text: When can customers outside the design partner group actually get Atlas? }
      - { who: Mira, at: '12:05', text: 'Workspaces beta goes to ten partners on 2 October. Public launch is on the roadmap for February; I would rather commit to a date once permissions are done.' }
      - { who: Dev, at: '27:30', text: Inference costs grew faster than usage in August because of the primary provider. Failover work lets us route on cost as well as health. }
  - id: 2
    date: 2026-09-10
    project: atlas
    duration: 35 min
    attendees: Product, design, eng
    title: Workspaces beta scope
    summary: Cut the activity feed from the beta scope to hold the 2 October date. Migration of single-user documents stays blocked on a data question with legal.
    decisions:
      - Activity feed moves to post-beta
      - Presence indicators stay in scope
    actions:
      - { text: Legal answer on migration consent, owner: Ana }
      - { text: Update roadmap bar, owner: Mira }
    transcript:
      - { who: Mira, at: '00:00', text: 'Goal today: agree on what ships on 2 October.' }
      - { who: Jonas, at: '06:20', text: Activity feed is another two weeks. I would drop it. }
      - { who: Mira, at: '06:50', text: Agreed. Presence stays because partners asked for it explicitly. }
  - id: 3
    date: 2026-09-08
    project: scout
    duration: 28 min
    attendees: Eng
    title: Provider failover design
    summary: Route each request on a rolling health score per provider. Alerts fire when failover triggers more than three times an hour.
    decisions:
      - Health score = p95 latency + error rate over 5 minutes
      - Manual override kept in admin
    actions:
      - { text: Implement scoring, owner: Sam }
      - { text: Alert wiring, owner: Dev }
    transcript:
      - { who: Sam, at: '00:00', text: Proposal is a rolling five-minute window per provider. }
      - { who: Dev, at: '09:15', text: Keep a manual override so we can pin a provider during incidents. }
  - id: 4
    date: 2026-09-02
    project: relay
    duration: 40 min
    attendees: Eng, support
    title: Webhook incident retrospective
    summary: Delayed deliveries on 9 September traced to connection pool exhaustion during a migration. Migrations now run from a separate pool with a hard timeout.
    decisions:
      - Separate DB pool for migrations
      - Replay endpoint prioritised
    actions:
      - { text: Pool separation PR, owner: Dev }
      - { text: Customer follow-up emails, owner: Support }
    transcript:
      - { who: Dev, at: '00:00', text: 'Timeline first, then causes, then what we change.' }
      - { who: Support, at: '18:00', text: 'Four customers noticed. None lost data, but two asked for a replay option.' }

