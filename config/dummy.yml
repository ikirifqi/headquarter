# Nothing here is persisted: the Dummy::* classes in app/models/dummy read this file on each
# request and shape it into Inertia props. Replace a section with a real source (Linear, Stripe,
# GitHub, ...) by swapping the matching Dummy class, not by editing the Svelte pages.
#
# Dates are ISO 8601 so the server can sort, group and position them. `today` pins the clock the
# mock data was written against, so relative values (due soon, roadmap marker) stay consistent.

