# status: operational | degraded | outage. `history` is the last 7 days, oldest first.
services:
  - name: Web app
    description: app.halden.ai
    status: operational
    uptime: 99.98%
    history: [operational, operational, operational, operational, operational, operational, operational]
  - name: Public API
    description: api.halden.ai · v2
    status: operational
    uptime: 99.95%
    history: [operational, operational, outage, operational, operational, operational, operational]
  - name: Model gateway
    description: Routes requests to OpenAI / Anthropic
    status: degraded
    uptime: 99.71%
    history: [operational, operational, operational, operational, operational, operational, degraded]
  - name: Authentication
    description: Sign-in, SSO, sessions
    status: operational
    uptime: 100%
    history: [operational, operational, operational, operational, operational, operational, operational]
  - name: Webhooks
    description: Outbound events to customers
    status: operational
    uptime: 99.90%
    history: [degraded, operational, operational, operational, operational, operational, operational]

