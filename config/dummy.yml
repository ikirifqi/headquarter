queues:
  - name: Default worker
    status: responding
    depth: 12
    latency: 0.8s
    last_beat: 14s
  - name: Email & notifications
    status: responding
    depth: 3
    latency: 0.2s
    last_beat: 22s
  - name: Model inference
    status: backlogged
    depth: 418
    latency: 46s
    last_beat: 9s
  - name: Nightly reports
    status: idle
    depth: 0
    latency: —
    last_beat: '03:10'

# state: investigating | identified | monitoring | resolved. Updates are newest first.
incidents:
  - date: 2026-09-15
    duration: Ongoing · 1h 12m
    title: Slow responses from model gateway
    state: monitoring
    affected: Model gateway, Model inference queue
    updates:
      - time: '09:48'
        label: Monitoring
        text: Traffic shifted to the secondary provider. Queue draining; wait times back under a minute within the hour.
      - time: '09:02'
        label: Identified
        text: Upstream provider rate-limiting our primary region. Inference jobs piling up.
      - time: '08:36'
        label: Investigating
        text: Elevated latency on assistant replies reported by two customers.
  - date: 2026-09-11
    duration: 38 min
    title: Public API returned errors for a subset of requests
    state: resolved
    affected: Public API
    updates:
      - time: '15:14'
        label: Resolved
        text: Faulty deploy rolled back. Error rate at zero for 20 minutes.
      - time: '14:41'
        label: Identified
        text: Release 2.14.0 introduced a validation bug on bulk endpoints.
      - time: '14:36'
        label: Investigating
        text: Spike in 5xx responses detected by Sentry.
  - date: 2026-09-09
    duration: 2h 05m
    title: Webhook deliveries delayed
    state: resolved
    affected: Webhooks
    updates:
      - time: '11:20'
        label: Resolved
        text: Backlog fully delivered. No events lost.
      - time: '09:15'
        label: Identified
        text: Database connection pool exhausted by a long-running migration.

